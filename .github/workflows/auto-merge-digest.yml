name: Auto-merge digest PRs

on:
  workflow_run:
    workflows: ["Weekly AI & Tech News Digest"]
    types: [completed]
    # Only digests generated from main publish automatically; test runs
    # dispatched from other branches leave their PR open for review.
    branches: [main]
  workflow_dispatch:

jobs:
  auto-merge:
    name: Merge newest digest PR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge newest digest PR, close superseded ones
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The conflict path below commits, which needs an author identity.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Newest first. Each digest fully replaces docs/index.html, so only
          # the newest PR is worth publishing; older ones are superseded.
          mapfile -t prs < <(gh pr list \
            --repo "$REPO" \
            --state open \
            --base main \
            --label digest \
            --json number \
            --jq 'sort_by(.number) | reverse | .[].number')

          if [[ ${#prs[@]} -eq 0 ]]; then
            echo "No open digest PRs found."
            exit 0
          fi

          newest="${prs[0]}"
          for pr in "${prs[@]:1}"; do
            echo "Closing PR #${pr} as superseded by #${newest}"
            gh pr close "${pr}" --repo "$REPO" --delete-branch \
              --comment "Superseded by #${newest}."
          done

          echo "Merging PR #${newest}"
          if gh pr merge "${newest}" --repo "$REPO" --squash --delete-branch; then
            exit 0
          fi

          echo "PR #${newest} did not merge cleanly. Updating its branch with main."
          gh pr checkout "${newest}" --repo "$REPO"
          git fetch origin main
          if ! git merge origin/main --no-ff --no-edit; then
            # Digest PRs only modify docs/index.html; keep the PR's version.
            git checkout --ours docs/index.html
            git add docs/index.html
            git commit --no-edit
          fi
          git push
          gh pr merge "${newest}" --repo "$REPO" --squash --delete-branch
